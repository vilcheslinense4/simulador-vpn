<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield VPN | Simulador Pro</title>
    <style>
        /* ==========================================
           ESTILOS BASE: ESTÉTICA HACKER / NEÓN
           ========================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: #050811;
            background-image: 
                radial-gradient(at 50% 0%, rgba(0, 210, 255, 0.18) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(255, 0, 110, 0.08) 0px, transparent 50%);
            color: #f4f7f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Contenedor Principal estilo Dashboard */
        .vpn-container {
            background: rgba(10, 17, 30, 0.8);
            width: 100%;
            max-width: 420px;
            border-radius: 30px;
            padding: 30px;
            border: 1px solid rgba(0, 210, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            text-align: center;
            position: relative;
        }

        /* Cabecera */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo { font-weight: 800; font-size: 1.2rem; color: #00d2ff; letter-spacing: 1px; text-shadow: 0 0 10px rgba(0,210,255,0.4); }
        
        .btn-volver {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        .btn-volver:hover { color: #00d2ff; }

        /* Escudo de Estado */
        .status-box {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.5s ease;
        }
        
        .status-box.unprotected { border-color: rgba(255, 0, 110, 0.3); box-shadow: inset 0 0 15px rgba(255, 0, 110, 0.1); }
        .status-box.protected { border-color: rgba(0, 210, 255, 0.4); box-shadow: inset 0 0 25px rgba(0, 210, 255, 0.15); }

        #status-text { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; margin-bottom: 5px; }
        .text-red { color: #ff006e; text-shadow: 0 0 10px rgba(255, 0, 110, 0.4); }
        .text-cyan { color: #00d2ff; text-shadow: 0 0 15px rgba(0, 210, 255, 0.5); }

        #ip-display { font-size: 1.4rem; font-weight: 700; font-family: 'Courier New', Courier, monospace; letter-spacing: 1px; }

        /* ==========================================
           EL BOTÓN CENTRAL DE ENCENDIDO (POWER)
           ========================================== */
        .power-wrapper {
            margin: 35px 0;
            display: flex;
            justify-content: center;
            position: relative;
        }

        .power-btn {
            width: 135px;
            height: 135px;
            border-radius: 50%;
            background: #0b111e;
            border: 4px solid #ff006e;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.2), inset 0 0 15px rgba(255, 0, 110, 0.2);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 5;
            outline: none;
        }

        .power-btn svg { width: 45px; height: 45px; fill: #ff006e; transition: all 0.5s ease; }

        .power-btn.connecting {
            border-color: #eab308;
            box-shadow: 0 0 30px rgba(234, 179, 8, 0.4);
            animation: pulse-yellow 1s infinite alternate;
        }
        .power-btn.connecting svg { fill: #eab308; }

        .power-btn.connected {
            border-color: #00d2ff;
            box-shadow: 0 0 50px rgba(0, 210, 255, 0.4), inset 0 0 20px rgba(0, 210, 255, 0.3);
            transform: scale(1.05);
        }
        .power-btn.connected svg { fill: #00d2ff; filter: drop-shadow(0 0 8px #00d2ff); }

        @keyframes pulse-yellow {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.03); opacity: 1; }
        }

        .pulse-ring {
            position: absolute;
            width: 135px;
            height: 135px;
            border-radius: 50%;
            border: 2px solid #00d2ff;
            opacity: 0;
            z-index: 1;
            pointer-events: none;
        }
        .pulse-ring.animating { animation: ripple 1.5s infinite linear; }
        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        /* Cronómetro */
        #timer { font-size: 1.1rem; opacity: 0.4; font-weight: 500; margin-top: -15px; margin-bottom: 25px; font-family: monospace; }
        #timer.active { opacity: 1; color: #00d2ff; text-shadow: 0 0 10px rgba(0,210,255,0.3); }

        /* Selector de Ubicación */
        .location-selector {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 18px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 15px;
        }

        .location-info { display: flex; align-items: center; gap: 12px; }
        #country-flag { font-size: 1.6rem; }
        .location-details { text-align: left; }
        .location-details label { display: block; font-size: 0.75rem; opacity: 0.5; text-transform: uppercase; margin-bottom: 4px; }
        #country-name { font-size: 0.95rem; font-weight: 600; }

        select {
            background: #0f172a;
            color: white;
            border: 1px solid rgba(0, 210, 255, 0.2);
            padding: 6px 10px;
            border-radius: 10px;
            outline: none;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* Características inferiores (Ping / Servidor) */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 15px; padding: 12px; text-align: left; }
        .stat-card span { display: block; font-size: 0.72rem; opacity: 0.5; text-transform: uppercase; margin-bottom: 4px; }
        .stat-card p { font-size: 1rem; font-weight: bold; color: #f4f7f6; }

        /* CONSOLA DE REGISTROS Y VELOCIDAD */
        .console-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 210, 255, 0.1);
            border-radius: 15px;
            padding: 12px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.75rem;
            height: 70px;
            overflow-y: hidden;
            color: #3adef7;
            line-height: 1.4;
        }
        .console-line { margin-bottom: 2px; opacity: 0.8; }
        .console-line.success { color: #10b981; }
        .console-line.alert { color: #f43f5e; }
    </style>
</head>
<body>

    <audio id="snd-click" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-84.wav" preload="auto"></audio>
    <audio id="snd-connect" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-84.wav" preload="auto"></audio>
    <audio id="snd-success" src="https://assets.mixkit.co/active_storage/sfx/2017/2017-84.wav" preload="auto"></audio>

    <div class="vpn-container">
        <header>
            <span class="logo">🛡️ SHIELD vpn</span>
            <a href="https://vilcheslinense4.github.io/mi-primer-portafolios/index.html" class="btn-volver">← Volver al portafolio</a>
        </header>

        <div id="status-card" class="status-box unprotected">
            <p id="status-text" class="text-red">Conexión Desprotegida</p>
            <p id="ip-display">185.124.74.22</p>
        </div>

        <div class="power-wrapper">
            <div id="pulse" class="pulse-ring"></div>
            <button id="vpn-toggle" class="power-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M11,6V12H13V6H11Z" />
                </svg>
            </button>
        </div>

        <p id="timer">00:00:00</p>

        <div class="location-selector">
            <div class="location-info">
                <span id="country-flag">🇺🇸</span>
                <div class="location-details">
                    <label>Ubicación VPN</label>
                    <span id="country-name">Estados Unidos</span>
                </div>
            </div>
            <select id="server-select">
                <option value="us">Estados Unidos</option>
                <option value="de">Alemania</option>
                <option value="jp">Japón</option>
                <option value="uk">Reino Unido</option>
                <option value="is">Islandia</option>
            </select>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span>Latencia / Cifrado</span>
                <p id="ping-display">145 ms</p>
                <p id="cipher-display" style="font-size: 0.75rem; font-weight: normal; opacity: 0.6; margin-top: 2px;">AES-0 (Ninguno)</p>
            </div>
            <div class="stat-card">
                <span>Velocidad Bajada</span>
                <p id="speed-display">0.0 Mbps</p>
            </div>
        </div>

        <div class="console-box" id="console-log">
            <div class="console-line">[SISTEMA] Listo para iniciar conexión...</div>
        </div>
    </div>

    <script>
        const paisesConfig = {
            us: { nombre: 'Estados Unidos', bandera: '🇺🇸', pingBase: 140 },
            de: { nombre: 'Alemania', bandera: '🇩🇪', pingBase: 42 },
            jp: { nombre: 'Japón', bandera: '🇯🇵', pingBase: 290 },
            uk: { nombre: 'Reino Unido', bandera: '🇬🇧', pingBase: 55 },
            is: { nombre: 'Islandia', bandera: '🇮🇸', pingBase: 110 }
        };

        const IP_REAL = "185.124.74.22";

        const vpnToggle = document.getElementById('vpn-toggle');
        const pulseRing = document.getElementById('pulse');
        const statusCard = document.getElementById('status-card');
        const statusText = document.getElementById('status-text');
        const ipDisplay = document.getElementById('ip-display');
        const serverSelect = document.getElementById('server-select');
        const countryFlag = document.getElementById('country-flag');
        const countryName = document.getElementById('country-name');
        const pingDisplay = document.getElementById('ping-display');
        const cipherDisplay = document.getElementById('cipher-display');
        const speedDisplay = document.getElementById('speed-display');
        const timerDisplay = document.getElementById('timer');
        const consoleLog = document.getElementById('console-log');

        const sndClick = document.getElementById('snd-click');
        const sndConnect = document.getElementById('snd-connect');
        const sndSuccess = document.getElementById('snd-success');

        let state = "disconnected"; 
        let timerInterval = null;
        let totalSeconds = 0;

        function generarIpFalsa() {
            return `${Math.floor(Math.random() * 220) + 10}.${Math.floor(Math.random() * 254)}.${Math.floor(Math.random() * 254)}.${Math.floor(Math.random() * 254)}`;
        }

        function printLog(text, type = "") {
            const line = document.createElement('div');
            line.className = `console-line ${type}`;
            line.innerText = `> ${text}`;
            consoleLog.appendChild(line);
            consoleLog.scrollTop = consoleLog.scrollHeight; 
            
            while (consoleLog.children.length > 3) {
                consoleLog.removeChild(consoleLog.firstChild);
            }
        }

        function actualizarDatosDinamicos(codigoPais) {
            const base = paisesConfig[codigoPais].pingBase;
            const fluctuacion = Math.floor(Math.random() * 11) - 5; 
            pingDisplay.innerText = `${base + fluctuacion} ms`;

            if (state === "connected") {
                const speed = (Math.random() * (450 - 320) + 320).toFixed(1);
                speedDisplay.innerText = `${speed} Mbps`;
            } else {
                speedDisplay.innerText = "0.0 Mbps";
            }
        }

        function startTimer() {
            totalSeconds = 0;
            timerDisplay.innerText = "00:00:00";
            timerDisplay.classList.add('active');
            
            timerInterval = setInterval(() => {
                totalSeconds++;
                let hrs = Math.floor(totalSeconds / 3600);
                let mins = Math.floor((totalSeconds - (hrs * 3600)) / 60);
                let secs = totalSeconds % 60;

                if (hrs < 10) hrs = "0" + hrs;
                if (mins < 10) mins = "0" + mins;
                if (secs < 10) secs = "0" + secs;

                timerDisplay.innerText = `${hrs}:${mins}:${secs}`;
                
                if (state === "connected") {
                    actualizarDatosDinamicos(serverSelect.value);
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerDisplay.classList.remove('active');
        }

        vpnToggle.addEventListener('click', () => {
            sndClick.currentTime = 0;
            sndClick.play().catch(()=> {});

            if (state === "disconnected") {
                state = "connecting";
                vpnToggle.className = "power-btn connecting";
                statusText.innerText = "Buscando nodo seguro...";
                statusText.className = ""; 
                statusText.style.color = "#eab308"; 

                sndConnect.currentTime = 0;
                sndConnect.play().catch(()=>{});

                printLog("Iniciando protocolo Shield...", "alert");
                setTimeout(() => printLog("Buscando servidores en " + paisesConfig[serverSelect.value].nombre + "..."), 600);
                setTimeout(() => printLog("Negociando clave de cifrado Diffie-Hellman..."), 1200);

                setTimeout(() => {
                    if (state !== "connecting") return; 
                    
                    state = "connected";
                    vpnToggle.className = "power-btn connected";
                    pulseRing.classList.add('animating');
                    
                    statusCard.className = "status-box protected";
                    statusText.innerText = "Conexión Cifrada / Protegido";
                    statusText.className = "text-cyan";
                    statusText.style.color = ""; 
                    
                    ipDisplay.innerText = generarIpFalsa();
                    cipherDisplay.innerText = "AES-256-GCM (Militar)";
                    
                    sndSuccess.currentTime = 0;
                    sndSuccess.play().catch(()=>{});

                    printLog("TÚNEL ESTABLECIDO CON ÉXITO.", "success");
                    printLog("Tráfico cifrado de extremo a extremo.", "success");
                    
                    startTimer();
                }, 1800); 

            } else if (state === "connected" || state === "connecting") {
                state = "disconnected";
                vpnToggle.className = "power-btn";
                pulseRing.className = "pulse-ring"; 
                
                statusCard.className = "status-box unprotected";
                statusText.innerText = "Conexión Desprotegida";
                statusText.className = "text-red";
                statusText.style.color = "";
                
                ipDisplay.innerText = IP_REAL;
                cipherDisplay.innerText = "AES-0 (Ninguno)";
                
                stopTimer();
                actualizarDatosDinamicos(serverSelect.value);
                printLog("Conexión abortada por el usuario.", "alert");
                printLog("Tu IP real vuelve a ser pública.", "alert");
            }
        });

        serverSelect.addEventListener('change', (e) => {
            const codigo = e.target.value;
            const info = paisesConfig[codigo];

            countryFlag.innerText = info.bandera;
            countryName.innerText = info.nombre;
            actualizarDatosDinamicos(codigo);

            printLog("Cambiando nodo a: " + info.nombre);

            if (state === "connected") {
                ipDisplay.innerText = generarIpFalsa();
                printLog("Nueva IP asignada en la región.", "success");
            }
        });

        actualizarDatosDinamicos('us');
    </script>
</body>
</html>
